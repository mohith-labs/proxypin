# ProxyPin web — reverse proxy + web UI on one port.
#   docker compose up -d --build
#   UI: http://localhost:8080/__proxypin/
services:
  proxypin:
    build: .
    image: proxypin-web:latest
    container_name: proxypin-web
    ports:
      - "8080:8080"
    environment:
      # Uncomment to require a login for the UI/API:
      # PROXYPIN_USER: admin
      # PROXYPIN_PASSWORD: change-me
      PROXYPIN_HISTORY_LIMIT: "2000"
    volumes:
      - proxypin-data:/data
    restart: unless-stopped

volumes:
  proxypin-data:
